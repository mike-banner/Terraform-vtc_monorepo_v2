name: 'Supabase Keep-Alive'

on:
  schedule:
    # S'exécute tous les 2 jours à 04:00 du matin (UTC)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis l'interface GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Démarrage du Ping vers Supabase pour empêcher la mise en veille (auto-pause)..."
          
          MISSING_SECRETS=""
          if [ -z "$SUPABASE_URL" ]; then MISSING_SECRETS="$MISSING_SECRETS SUPABASE_URL"; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then MISSING_SECRETS="$MISSING_SECRETS SUPABASE_ANON_KEY"; fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "❌ Erreur : Secret(s) GitHub manquant(s) :$MISSING_SECRETS"
            echo "👉 Ajoutez-les dans Repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          
          # Nettoyage de l'URL (suppression du slash final éventuel)
          CLEAN_URL="${SUPABASE_URL%/}"
          
          # Désactiver temporairement 'set -e' si c'est activé par défaut par GitHub Actions,
          # pour pouvoir capturer le code d'erreur de curl
          set +e
          
          # /rest/v1/ exige désormais la clé secret_role. /storage/v1/status fonctionne avec la clé ANON et réveille la DB.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$CLEAN_URL/storage/v1/status" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          CURL_EXIT_CODE=$?
          
          set -e
          
          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "❌ Erreur curl ($CURL_EXIT_CODE). L'URL configurée est peut-être invalide."
            exit 1
          fi
            
          echo "Réponse HTTP de Supabase : $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Ping réussi ! La base de données est réveillée."
          else
            echo "❌ Échec du Ping : statut HTTP $HTTP_STATUS (attendu: 200)."
            exit 1
          fi
