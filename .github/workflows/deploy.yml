name: 'Deploy to Cloudflare Pages'

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Garde-fous avant tout déploiement : secrets versionnés + typecheck.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuser les secrets versionnés
        run: |
          if git ls-files --error-unmatch apps/vtc-backoffice/.dev.vars >/dev/null 2>&1; then
            echo "::error file=apps/vtc-backoffice/.dev.vars::Ce fichier contient des secrets et ne doit pas être versionné."
            exit 1
          fi
          if git grep -n -I -E 'sb_secret_[A-Za-z0-9_-]{10,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,}' -- . ':!*.md' ':!*.example'; then
            echo "::error::Clé secrète détectée dans un fichier versionné."
            exit 1
          fi

      # Lint correctness (pas de style) : bloque sur les erreurs, laisse passer la
      # dette signalée en warning. Voir eslint.config.mjs.
      - name: Lint
        run: pnpm lint

      - name: Typecheck vtc-websites
        run: pnpm --filter @vtc/vtc-websites exec tsc --noEmit

      - name: Typecheck vtc-backoffice
        run: pnpm --filter @vtc/vtc-backoffice exec tsc --noEmit

      - name: Typecheck superadmin
        run: pnpm --filter superadmin exec tsc -b

  build-and-deploy:
    needs: verify
    # On ne déploie que sur push (pas sur les pull requests).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    env:
      # Mapping de la branche vers l'environnement (production ou dev)
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Deploy Backoffice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy apps/vtc-backoffice/dist --project-name=vtc-backoffice-${{ env.ENVIRONMENT }} --branch main

      - name: Deploy VTC Websites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy apps/vtc-websites/dist --project-name=vtc-drivers-front-${{ env.ENVIRONMENT }} --branch main

      - name: Deploy Superadmin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy apps/superadmin/dist --project-name=vtc-superadmin-${{ env.ENVIRONMENT }} --branch main
