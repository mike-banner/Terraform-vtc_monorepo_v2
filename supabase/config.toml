
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[functions.stripe_webhook]
enabled = true
# Stripe ne peut pas fournir de JWT Supabase : l'authentification se fait par
# la signature `stripe-signature` vérifiée via constructEventAsync().
verify_jwt = false
import_map = "./functions/stripe_webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/stripe_webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/stripe_webhook/*.html" ]

[functions.send-email]
enabled = true
# Appelée seulement de serveur à serveur (webhook Stripe, génération de pièces) avec la clé de service en Bearer.
# Les fonctions reçoivent cette clé au format `sb_secret_…`, que la passerelle ne sait pas vérifier comme JWT :
# avec verify_jwt = true elle répondait 403 avant l'exécution du code, donc aucun e-mail ne partait.
# L'autorisation reste stricte : le code compare le Bearer à SUPABASE_SERVICE_ROLE_KEY (T-14.1-36).
verify_jwt = false
import_map = "./functions/send-email/deno.json"
entrypoint = "./functions/send-email/index.ts"

